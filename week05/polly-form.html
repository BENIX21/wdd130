<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>polly-form</title>
    <meta name="descripcion" content="Build the Form">
    <meta name="author" content="Benjamin Heredia">
    <link rel="stylesheet" href="styles/polly-form.css">
</head>

<body>

    <header>
        <h1>WDD 130 | Basic HTML and CSS Quiz</h1>
    </header>

    <main>

        <form>
            <div class="form-item">
                <label for="q1"><span class="q-num">1.</span> What does the acronym CSS stand
                    for?</label>
                <input type="text" id="q1" name="q1" required>
            </div>

            <div class="form-item">
                <label for="q2"><span class="q-num">2.</span> How are id and class attributes
                    selected
                    in CSS?</label>
                <textarea id="q2" name="q2" rows="4" required></textarea>
            </div>

            <div class="form-item">
                <label for="q3"><span class="q-num">3.</span> Which of the following is a valid CSS
                    comment?</label>
                <select id="q3" name="q3" required>
                    <option value="" selected disabled>Choose One ...</option>
                    <option value="1">/* This is a comment */</option>
                    <option value="2">&lt;!-- This is a comment --&gt;</option>
                    <option value="3">// This is a comment</option>
                    <option value="4">' This is a comment '</option>
                </select>
            </div>

            <div class="form-item">
                <label for="q4"><span class="q-num">4.</span> What is the default font size in
                    pixels
                    for most web browsers?</label>
                <input type="number" id="q4" name="q4" placeholder="e.g. 16" required>
            </div>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>

    <footer>
        <p>©2026 | WDD 130 | Benjamin Heredia</p>
    </footer>

</body>
